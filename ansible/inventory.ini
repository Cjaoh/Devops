# ── Inventaire Ansible ────────────────────────────────────────────
# VM Application (déploiement)
# Note : la clé SSH est injectée dynamiquement par Jenkins via --private-key
[server]
192.168.43.130 ansible_user=lms

# VM Harbor (registre — déclaré pour référence, non géré par Ansible)
[harbor]
192.168.43.133 ansible_user=lms

# ── Variables communes ────────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
