services:
  # ──────────────────────────────────────────
  # Jenkins avec accès complet au Docker Hôte
  # ──────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Partage du moteur de conteneurisation
      
    networks:
      - app_net

  # ──────────────────────────────────────────
  # Base de données PostgreSQL
  # ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: reservation_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reserv_user
      POSTGRES_PASSWORD: mon_password_defaut
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net

  # ──────────────────────────────────────────
  # Application FastAPI (Reçoit le Tag dynamique)
  # ──────────────────────────────────────────
  app:
    image: localhost/library/resource-app:${IMAGE_TAG:-latest}
    container_name: reservation_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://reserv_user:mon_password_defaut@db:5432/reservations
      SECRET_KEY: une_cle_de_secours_jwt_123
      ENVIRONMENT: production
    networks:
      - app_net
    expose:
      - "8000"

  # ──────────────────────────────────────────
  # Reverse proxy Nginx (Accessible sur le Port 81)
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: reservation_nginx
    restart: unless-stopped
    ports:
      - "81:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - app_net

volumes:
  jenkins_home:
  db_data:

networks:
  app_net:
    driver: bridge
